    <script>
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-slate-900 text-white border-emerald-500/40' : 'bg-slate-900 text-white border-primary-500/40';
            const iconClass = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-primary-400';
            
            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border shadow-floating text-xs font-medium animate-modal-in ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${iconClass} text-sm"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function navigateTo(screenId, projId = null) {
            currentScreen = screenId;
            if (projId) state.activeProjectId = projId;
            closeNotificationDrawer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
        }

        function toggleEmptyStateTest() {
            if (state.currentUser.avatar || state.currentUser.coverImage) {
                state.currentUser.avatar = null;
                state.currentUser.coverImage = null;
                showToast("Simulando Perfil con Estados Vacíos", "info");
            } else {
                state.currentUser.avatar = 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400';
                state.currentUser.coverImage = 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600';
                state.currentUser.coverPositionY = 50;
                showToast("Restauradas Imágenes de Perfil", "success");
            }
            renderApp();
        }

        function updateHeaderUI() {

            if (container) {
                if (state.currentUser.avatar) {
                    container.innerHTML = `<img src="${state.currentUser.avatar}" class="h-full w-full object-cover">`;

                    const initials = state.currentUser.name.split(' ').map(n => n[0]).join('');
                    container.innerHTML = `<span class="text-xs font-bold font-mono text-slate-700">${initials}</span>`;
                }
            }

            const headerName = document.getElementById('header-name');
            if (headerName) headerName.textContent = state.currentUser.name;

            const headerRole = document.getElementById('header-role');
            if (headerRole) headerRole.textContent = state.currentUser.role;
            
            const btnEs = document.getElementById('btn-lang-es');
            const btnEn = document.getElementById('btn-lang-en');
            if (btnEs && btnEn) {
                if (currentLang === 'es') {
                    btnEs.className = "px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs font-bold text-xs";
                    btnEn.className = "px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-900 text-xs";
                } else {
                    btnEn.className = "px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs font-bold text-xs";
                    btnEs.className = "px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-900 text-xs";
                }
            }

            if (navHow) navHow.textContent = t('nav_howItWorks');

            const navBrowse = document.getElementById('nav-browse');
            if (navBrowse) navBrowse.textContent = t('nav_browse');

            const navProf = document.getElementById('nav-profile-text');
            if (navProf) navProf.textContent = t('nav_profile');

            const simTitle = document.getElementById('sim-title');
            if (simTitle) simTitle.textContent = t('sim_controller');

            const simDesc = document.getElementById('sim-desc');
            if (simDesc) simDesc.textContent = t('sim_desc');

            const simDonor = document.getElementById('sim-donor-label');
            if (simDonor) simDonor.textContent = t('sim_donor_btn');

            const simNgo = document.getElementById('sim-ngo-label');
            if (simNgo) simNgo.textContent = t('sim_ngo_btn');

            const footerTag = document.getElementById('footer-tagline');
            if (footerTag) footerTag.textContent = t('footer_tagline');
        }

        function openNotificationDrawer() {
            const drawer = document.getElementById('notification-drawer');
            if (drawer) {
                drawer.classList.remove('hidden');
                renderNotifications();
            }
        }

        function closeNotificationDrawer() {
            const drawer = document.getElementById('notification-drawer');
            if (drawer) drawer.classList.add('hidden');
        }

        function markAllNotificationsRead() {
            state.notifications.forEach(n => n.unread = false);
            const badge = document.getElementById('notif-badge');
            if (badge) badge.classList.add('hidden');
            renderNotifications();
        }

        function renderNotifications() {
            const listContainer = document.getElementById('notifications-list-container');
            if (!listContainer) return;
            if (state.notifications.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-regular fa-bell-slash text-2xl text-slate-300 mb-2"></i>
                        <p class="text-xs font-medium text-slate-600">No notifications yet</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="space-y-3">';
            state.notifications.forEach(notif => {
                const icon = notif.type === 'invoice' ? 'fa-receipt text-primary-600 bg-primary-50' : 'fa-circle-check text-emerald-600 bg-emerald-50';
                html += `
                    <div class="flex items-start space-x-3 p-3 rounded-xl hover:bg-slate-50 transition-colors ${notif.unread ? 'bg-slate-50 border-l-2 border-primary-600' : ''}">
                        <div class="h-8 w-8 rounded-lg flex items-center justify-center flex-shrink-0 text-xs ${icon.split(' ').slice(1).join(' ')}">
                            <i class="fa-solid ${icon.split(' ')[0]}"></i>
                        </div>
                        <div class="flex-grow text-left">
                            <p class="text-xs text-slate-700 leading-relaxed">${notif.text}</p>
                            <span class="text-[10px] text-slate-400 font-mono mt-1 block">${notif.time}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listContainer.innerHTML = html;
        }

        function renderApp() {
            const canvas = document.getElementById('app-canvas');
            if (!canvas) return;
            updateHeaderUI();
            canvas.innerHTML = '';

            switch(currentScreen) {
                case 'profile':
                    renderProfilePage(canvas);
                    break;
                case 'landing':
                    renderLandingPage(canvas);
                    break;
                case 'browse':
                    renderBrowsePage(canvas);
                    break;
                case 'detail':
                    renderProjectDetailPage(canvas, state.activeProjectId);
                    break;
            }
        }
    </script>

    <script>
        let currentAvatarFile = null;
        let avatarZoom = 1;
        let avatarPanX = 0;
        let avatarPanY = 0;
        let isDraggingAvatar = false;
        let startX, startY;

        function openAvatarModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
                    <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity" onclick="closeModal()"></div>
                    
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-floating border border-slate-200 relative z-10 animate-modal-in text-left space-y-5">
                        
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div class="flex items-center space-x-2">
                                <div class="h-8 w-8 rounded-lg bg-primary-50 text-primary-600 flex items-center justify-center text-sm font-bold">
                                    <i class="fa-solid fa-camera"></i>
                                </div>
                                <div>
                                    <h3 class="text-sm font-bold text-slate-900">${t('change_photo')}</h3>
                                    <p class="text-[10px] font-mono text-slate-400">Circular crop & compression preview</p>
                                </div>
                            </div>
                            <button onclick="closeModal()" class="rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>

                        <div id="avatar-cropper-step">
                            <div id="avatar-dropzone" 
                                 class="border-2 border-dashed border-slate-200 hover:border-primary-500 rounded-2xl p-6 text-center cursor-pointer transition-colors bg-slate-50 hover:bg-primary-50/30"
                                 onclick="document.getElementById('avatar-file-input').click()"
                                 ondragover="event.preventDefault(); this.classList.add('border-primary-500')"
                                 ondragleave="this.classList.remove('border-primary-500')"
                                 ondrop="handleAvatarDrop(event)">
                                
                                <input type="file" id="avatar-file-input" accept="image/*" class="hidden" onchange="handleAvatarFileSelect(event)">
                                <div class="h-12 w-12 rounded-full bg-white shadow-xs mx-auto mb-2 flex items-center justify-center text-primary-600 text-lg">
                                    <i class="fa-solid fa-cloud-arrow-up"></i>
                                </div>
                                <p class="text-xs font-bold text-slate-800">Click to upload or drag & drop</p>
                                <p class="text-[10px] text-slate-400 font-mono mt-1">PNG, JPG, WebP up to 10MB</p>
                            </div>

                            <div id="avatar-editor-box" class="hidden space-y-4">
                                <div class="relative h-64 bg-slate-900 rounded-2xl overflow-hidden cursor-grab flex items-center justify-center select-none"
                                     id="avatar-canvas-wrapper"
                                     onmousedown="startAvatarDrag(event)"
                                     onmousemove="dragAvatar(event)"
                                     onmouseup="endAvatarDrag()"
                                     onmouseleave="endAvatarDrag()"
                                     ontouchstart="startAvatarDrag(event)"
                                     ontouchmove="dragAvatar(event)"
                                     ontouchend="endAvatarDrag()">
                                    
                                    <canvas id="avatar-crop-canvas" class="max-w-full max-h-full"></canvas>
                                    
                                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                                        <div class="w-44 h-44 rounded-full ring-[999px] ring-slate-950/70 border-2 border-white/80 shadow-2xl"></div>
                                    </div>

                                    <div class="absolute bottom-2 left-2 bg-slate-950/80 px-2 py-1 rounded text-[9px] font-mono text-slate-300 pointer-events-none">
                                        <i class="fa-solid fa-hand-pointer mr-1"></i> Drag to Pan
                                    </div>
                                </div>

                                <div class="space-y-1">
                                    <div class="flex items-center justify-between text-xs text-slate-600 font-mono">
                                        <span><i class="fa-solid fa-magnifying-glass text-slate-400"></i> Zoom</span>
                                        <span id="avatar-zoom-val">100%</span>
                                    </div>
                                    <input type="range" min="0.5" max="2.5" step="0.05" value="1" id="avatar-zoom-slider" class="w-full accent-primary-600" oninput="updateAvatarZoom(this.value)">
                                </div>
                            </div>
                        </div>

                        <div id="avatar-progress-container" class="hidden space-y-2">
                            <div class="flex items-center justify-between text-xs font-mono">
                                <span id="avatar-progress-status" class="text-slate-600">Uploading...</span>
                                <span id="avatar-progress-percent" class="font-bold text-primary-600">0%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div id="avatar-progress-bar" class="h-full bg-primary-600 transition-all duration-150 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                            <div>
                                ${state.currentUser.avatar ? `
                                    <button onclick="removeAvatarImage()" class="text-xs font-semibold text-rose-600 hover:underline">
                                        ${t('remove_photo')}
                                    </button>
                                ` : ''}
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50">
                                    ${t('cancel')}
                                </button>
                                <button id="save-avatar-btn" disabled onclick="saveCroppedAvatar()" class="px-5 py-2 rounded-xl text-xs font-bold bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                                    ${t('save_changes')}
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            `;
            avatarZoom = 1;
            avatarPanX = 0;
            avatarPanY = 0;
        }

        function handleAvatarDrop(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) processAvatarImageFile(files[0]);
        }

        function handleAvatarFileSelect(e) {
            if (e.target.files.length > 0) processAvatarImageFile(e.target.files[0]);
        }

        function processAvatarImageFile(file) {
            if (!file.type.startsWith('image/')) {
                showToast("Please select a valid image file", "info");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentAvatarFile = img;
                    document.getElementById('avatar-dropzone').classList.add('hidden');
                    document.getElementById('avatar-editor-box').classList.remove('hidden');
                    document.getElementById('save-avatar-btn').removeAttribute('disabled');
                    drawAvatarCanvas();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function updateAvatarZoom(val) {
            avatarZoom = parseFloat(val);
            document.getElementById('avatar-zoom-val').textContent = Math.round(avatarZoom * 100) + '%';
            drawAvatarCanvas();
        }

        function startAvatarDrag(e) {
            isDraggingAvatar = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - avatarPanX;
            startY = clientY - avatarPanY;
            document.getElementById('avatar-canvas-wrapper').className = "relative h-64 bg-slate-900 rounded-2xl overflow-hidden cursor-grabbing flex items-center justify-center select-none";
        }

        function dragAvatar(e) {
            if (!isDraggingAvatar) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            avatarPanX = clientX - startX;
            avatarPanY = clientY - startY;
            drawAvatarCanvas();
        }

        function endAvatarDrag() {
            isDraggingAvatar = false;
            const wrapper = document.getElementById('avatar-canvas-wrapper');
            if (wrapper) {
                wrapper.className = "relative h-64 bg-slate-900 rounded-2xl overflow-hidden cursor-grab flex items-center justify-center select-none";
            }
        }

        function drawAvatarCanvas() {
            if (!currentAvatarFile) return;
            const canvas = document.getElementById('avatar-crop-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = 320;
            canvas.height = 320;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const scale = Math.min(canvas.width / currentAvatarFile.width, canvas.height / currentAvatarFile.height) * avatarZoom;
            const w = currentAvatarFile.width * scale;
            const h = currentAvatarFile.height * scale;
            const x = (canvas.width - w) / 2 + avatarPanX;
            const y = (canvas.height - h) / 2 + avatarPanY;

            ctx.drawImage(currentAvatarFile, x, y, w, h);
        }

        async function saveCroppedAvatar() {
            if (!currentAvatarFile) return;

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = 400;
            cropCanvas.height = 400;
            const ctx = cropCanvas.getContext('2d');

            const srcCanvas = document.getElementById('avatar-crop-canvas');
            ctx.drawImage(srcCanvas, 0, 0, 320, 320, 0, 0, 400, 400);

            const finalBase64 = cropCanvas.toDataURL('image/jpeg', 0.92);

            document.getElementById('avatar-editor-box').classList.add('hidden');
            document.getElementById('avatar-progress-container').classList.remove('hidden');
            document.getElementById('save-avatar-btn').disabled = true;

            await storageService.uploadAvatar(
                state.currentUser.id,
                finalBase64,
                (percent, statusMsg) => {
                    document.getElementById('avatar-progress-bar').style.width = percent + '%';
                    document.getElementById('avatar-progress-percent').textContent = percent + '%';
                    document.getElementById('avatar-progress-status').textContent = statusMsg;
                }
            );

            state.currentUser.avatar = finalBase64;
            closeModal();
            renderApp();
            showToast("Profile Picture updated successfully!", "success");
        }

        async function removeAvatarImage() {
            await storageService.removeMedia(state.currentUser.id, 'avatar');
            state.currentUser.avatar = null;
            closeModal();
            renderApp();
            showToast("Profile Picture removed", "info");
        }
    </script>

                previewImg.src = state.currentUser.coverImage;
                previewImg.style.objectPosition = `center ${coverPositionY}%`;
            }

        function handleCoverDrop(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) processCoverFile(files[0]);
        }

        function handleCoverFileSelect(e) {
            if (e.target.files.length > 0) processCoverFile(e.target.files[0]);
        }

        function processCoverFile(file) {
            if (!file.type.startsWith('image/')) {
                showToast("Please select a valid image file", "info");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                currentCoverFile = event.target.result;
                document.getElementById('cover-dropzone').classList.add('hidden');
                document.getElementById('cover-preview-box').classList.remove('hidden');
                document.getElementById('save-cover-btn').removeAttribute('disabled');
                
                const previewImg = document.getElementById('cover-preview-img');
                previewImg.src = currentCoverFile;
                previewImg.style.objectPosition = `center ${coverPositionY}%`;
            }
            reader.readAsDataURL(file);
        }

        function updateCoverPositionY(val) {
            coverPositionY = val;
            document.getElementById('cover-pos-val').textContent = val + '%';
            const previewImg = document.getElementById('cover-preview-img');
            if (previewImg) {

            document.getElementById('cover-preview-box').classList.add('hidden');
            document.getElementById('cover-progress-container').classList.remove('hidden');
            document.getElementById('save-cover-btn').disabled = true;

            const res = await storageService.uploadCover(
                state.currentUser.id,

                coverPositionY,

                    document.getElementById('cover-progress-status').textContent = statusMsg;

            state.currentUser.coverPositionY = res.positionY;
            closeModal();
            renderApp();

                                <h3 class="text-base font-bold text-slate-900 font-mono uppercase tracking-wider">Live Audit Timeline</h3>
                                ${updatesHtml}
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-card space-y-6 sticky top-24">
                                <div class="space-y-2">
                                    <div class="flex justify-between items-baseline font-mono">
                                        <span class="text-2xl font-black text-slate-900">${formatCurrency(proj.amountRaised)}</span>
                                        <span class="text-xs text-slate-400">of ${formatCurrency(proj.targetGoal)}</span>
                                    </div>
                                    <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-primary-600 rounded-full" style="width: ${percent}%"></div>
                                    </div>
                                </div>

                                <div class="space-y-3 pt-2">
                                    <button onclick="openDonateModal('${proj.id}')" class="w-full py-3.5 rounded-xl font-bold bg-primary-600 text-white hover:bg-primary-700 shadow-sm transition-all text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-heart text-white"></i> <span>Back this Project</span>
                                    </button>
                                </div>

                                <div class="border-t border-slate-100 pt-4 space-y-3 text-xs font-mono">
                                    <div class="flex justify-between text-slate-600">
                                        <span>Deployment Area:</span>
                                        <span class="font-bold text-slate-900">${proj.location}</span>
                                    </div>
                                    <div class="flex justify-between text-slate-600">
                                        <span>Audited Overhead:</span>
                                        <span class="font-bold text-emerald-600">${proj.averageOverhead}% Fee</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }
    </script>

    <script>
        function openDonateModal(projId) {
            const proj = state.projects.find(p => p.id === projId) || state.projects[0];
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
                    <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity" onclick="closeModal()"></div>
                    
                    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-floating border border-slate-200 relative z-10 animate-modal-in text-left space-y-5">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div>
                                <h3 class="text-sm font-bold text-slate-900">Support Campaign</h3>
                                <p class="text-[10px] font-mono text-slate-400">${proj.title}</p>
                            </div>
                            <button onclick="closeModal()" class="rounded-lg text-slate-400 hover:text-slate-600 p-1">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>

                        <div class="space-y-4">
                            <label class="block text-xs font-mono font-bold text-slate-700">Select Donation Amount (USD)</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button onclick="setDonateAmount(50)" class="donate-amt-btn p-3 rounded-xl border border-slate-200 font-mono font-bold text-xs hover:border-primary-600 text-slate-800">$50</button>
                                <button onclick="setDonateAmount(150)" class="donate-amt-btn p-3 rounded-xl border-2 border-primary-600 bg-primary-50 font-mono font-bold text-xs text-primary-700">$150</button>
                                <button onclick="setDonateAmount(300)" class="donate-amt-btn p-3 rounded-xl border border-slate-200 font-mono font-bold text-xs hover:border-primary-600 text-slate-800">$300</button>
                            </div>

                            <button onclick="executeDonation('${proj.id}')" class="w-full py-3.5 rounded-xl font-bold bg-primary-600 text-white hover:bg-primary-700 shadow-sm transition-all text-xs uppercase tracking-wider">
                                Complete Contribution of $150
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setDonateAmount(amt) {
            showToast(`Amount set to $${amt}`, 'info');
        }

        function executeDonation(projId) {
            closeModal();
            showToast("Thank you! Your donation of $150 has cleared via Stripe Wire.", "success");
        }
    </script>

    <script>
        window.onload = function() {
            renderApp();
        };
    </script>

</body>
</html>
